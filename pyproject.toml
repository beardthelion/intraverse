[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secresearch"
version = "0.1.0"
description = "Jev-guided autonomous security research loop: attack-path graph search over codebases"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
security-research = "secresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secresearch = ["py.typed"]
